<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('spectrum-ui-theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Vehicle wraps, window tint, paint protection film (PPF), wheels, lifts & accessories — custom work in Houston." />
    <title>Spectrum Outfitters · Wraps, tint, PPF & wheels — Houston</title>

    <!-- Link previews (Messages, Slack, etc.) — uses absolute URLs for production host -->

    <meta property="og:image" content="https://login.spectrumoutfitters.com/og-share.png" />
