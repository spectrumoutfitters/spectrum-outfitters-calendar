name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      # Log what changed (optional). Deploy always pushes backend + restarts PM2 so the
      # DigitalOcean droplet never stays on stale server.js while the UI updates.
      - name: List changed files
        run: |
          echo "Changed files:"
          git diff --name-only HEAD~1 HEAD || true

      # Always build & deploy frontend on main — conditional deploys skipped UI updates when
      # change detection missed paths or users needed the latest bundle/cache-bust.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy frontend
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            frontend/dist/ \
            root@165.245.137.192:/var/www/spectrum-outfitters/frontend/dist/

      - name: Deploy backend
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='database/shop_tasks.db' \
            --exclude='database/shop_tasks.db-wal' \
            --exclude='database/shop_tasks.db-shm' \
            --exclude='uploads/' \
            --exclude='backups/' \
            --exclude='.env' \
            backend/ \
            root@165.245.137.192:/var/www/spectrum-outfitters/backend/

      - name: Install deps, migrate, restart PM2 (DigitalOcean)
        run: |
          ssh root@165.245.137.192 "cd /var/www/spectrum-outfitters/backend && npm install && node database/startup.js && pm2 restart spectrum-outfitters"

      # Raffle app: /opt/spectrum-raffle/raffle-platform (PM2 spectrum-raffle, port 3001). One-time server
      # setup: /etc/spectrum-raffle.env + nginx (see raffle-platform/scripts/SETUP_SERVER.md).
      - name: Deploy raffle platform (rsync)
        run: |
          ssh root@165.245.137.192 "mkdir -p /opt/spectrum-raffle/raffle-platform"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env.local' \
            --exclude='public/raffle-images/' \
            raffle-platform/ \
            root@165.245.137.192:/opt/spectrum-raffle/raffle-platform/

      # APPS_SCRIPT_URL is hardcoded below to the live Apps Script /exec deployment.
      # When you redeploy Apps Script (which generates a NEW /exec URL), update the
      # APPS_URL value in this step. Setting a RAFFLE_APPS_SCRIPT_URL repo secret
      # also overrides it without a code change.
      #
      # Repo Secrets (optional overrides — Settings → Secrets and variables → Actions):
      #   RAFFLE_APPS_SCRIPT_URL          override Apps Script web app /exec URL
      #   STRIPE_SECRET_KEY               for paid tickets — leave blank to disable buy
      #   STRIPE_WEBHOOK_SECRET           whsec_… from Stripe webhook endpoint
      #   RAFFLE_PAID_PURCHASE_SECRET     32-byte hex; must MATCH Apps Script PAID_PURCHASE_SECRET
      # NEXT_PUBLIC_RAFFLE_SITE_URL is hardcoded to the production host below (it is not a secret).
      - name: Raffle — write /etc/spectrum-raffle.env from GitHub secrets
        env:
          APPS_URL: ${{ secrets.RAFFLE_APPS_SCRIPT_URL || 'https://script.google.com/macros/s/AKfycbx5A_Xb-WaF2aM8cp27ah7nnBXrWmRo2fJ1aB9WghkGeKX-5U4XdfOZKdF-CyyqdVjG/exec' }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WHSEC: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAID_PURCHASE: ${{ secrets.RAFFLE_PAID_PURCHASE_SECRET }}
        run: |
          if [ -z "${APPS_URL:-}" ]; then
            echo "APPS_URL empty — leaving /etc/spectrum-raffle.env untouched."
            exit 0
          fi
          {
            echo "APPS_SCRIPT_URL=${APPS_URL}"
            echo "NODE_ENV=production"
            echo "NEXT_PUBLIC_RAFFLE_SITE_URL=https://raffle.spectrumoutfitters.com"
            if [ -n "${STRIPE_SECRET:-}" ]; then echo "STRIPE_SECRET_KEY=${STRIPE_SECRET}"; fi
            if [ -n "${STRIPE_WHSEC:-}" ]; then echo "STRIPE_WEBHOOK_SECRET=${STRIPE_WHSEC}"; fi
            if [ -n "${PAID_PURCHASE:-}" ]; then echo "RAFFLE_PAID_PURCHASE_SECRET=${PAID_PURCHASE}"; fi
          } | ssh root@165.245.137.192 'umask 077; cat > /etc/spectrum-raffle.env; chmod 600 /etc/spectrum-raffle.env'
          # Echo which optional pieces were synced (without leaking values).
          echo "Wrote /etc/spectrum-raffle.env."
          echo "  APPS_SCRIPT_URL: set"
          if [ -n "${STRIPE_SECRET:-}" ]; then echo "  STRIPE_SECRET_KEY: set"; else echo "  STRIPE_SECRET_KEY: (missing — paid tickets disabled)"; fi
          if [ -n "${STRIPE_WHSEC:-}" ]; then echo "  STRIPE_WEBHOOK_SECRET: set"; else echo "  STRIPE_WEBHOOK_SECRET: (missing — webhooks will 503)"; fi
          if [ -n "${PAID_PURCHASE:-}" ]; then echo "  RAFFLE_PAID_PURCHASE_SECRET: set"; else echo "  RAFFLE_PAID_PURCHASE_SECRET: (missing — sheet won't accept paid writes)"; fi

      - name: Raffle — install, build, restart PM2
        run: |
          ssh root@165.245.137.192 bash -s <<'ENDSSH'
          set -euo pipefail
          mkdir -p /var/log/spectrum-raffle
          # Next.js 16+ requires Node >= 20.9; droplet may still be on 18 for legacy apps
          NODE_MAJOR=$(node -p "parseInt(process.versions.node.split('.')[0],10)" 2>/dev/null || echo 0)
          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "Raffle: installing Node.js 20.x (current: $(node -v 2>/dev/null || echo none))"
            export DEBIAN_FRONTEND=noninteractive
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs
          fi
          node -v
          cd /opt/spectrum-raffle/raffle-platform
          if [ -f /etc/spectrum-raffle.env ]; then
            cp /etc/spectrum-raffle.env .env.local
            echo "Raffle: synced .env.local from /etc/spectrum-raffle.env"
          else
            echo "Raffle: /etc/spectrum-raffle.env not found yet — create it for APPS_SCRIPT_URL (setup page will guide you)."
          fi
          npm ci --include=dev
          npm run build
          if pm2 describe spectrum-raffle >/dev/null 2>&1; then
            pm2 restart spectrum-raffle
          else
            pm2 start ecosystem.config.cjs --env production
          fi
          pm2 save
          ENDSSH

      # Without this, raffle.* hits default_server → static 404. Installs proxy to :3001 once.
      - name: Raffle — enable nginx site (first time or broken symlink)
        run: |
          ssh root@165.245.137.192 bash -s <<'ENDSSH'
          set -euo pipefail
          SRC=/opt/spectrum-raffle/raffle-platform/scripts/raffle.nginx
          AV=/etc/nginx/sites-available/spectrum-raffle
          EN=/etc/nginx/sites-enabled/spectrum-raffle
          if [ ! -f "$SRC" ]; then echo "Missing $SRC"; exit 1; fi
          if [ -L "$EN" ] && [ ! -e "$EN" ]; then rm -f "$EN"; fi
          if [ -L "$EN" ] && [ -e "$EN" ]; then
            echo "Raffle nginx site already enabled: $EN"
          else
            echo "Installing raffle nginx reverse proxy (HTTP → 127.0.0.1:3001)..."
            cp "$SRC" "$AV"
            ln -sf "$AV" "$EN"
          fi
          nginx -t
          ENDSSH

      - name: Reload nginx
        run: |
          ssh root@165.245.137.192 "touch /var/www/spectrum-outfitters/frontend/dist/index.html 2>/dev/null || true; systemctl reload nginx"
